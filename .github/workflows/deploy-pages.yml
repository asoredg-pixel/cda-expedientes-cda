# Publica el sitio estático en GitHub Pages al hacer push a main.
# IMPORTANTE: Settings → Pages → Build and deployment → Source: GitHub Actions
# (desactive "Deploy from a branch" para evitar dos despliegues en conflicto)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='backups' \
            --exclude='tests' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # El API de Pages a veces responde "Deployment failed, try again later."
      # de forma transitoria. Reintentamos hasta 3 veces para que un fallo
      # temporal no deje el sitio desactualizado ni genere correos de fallo.
      - name: Deploy to GitHub Pages (intento 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar antes de reintentar
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (intento 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar antes del último intento
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (intento 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
